    La tipografía NO se pide aquí a propósito.

    Antes este archivo traía `<link href="https://fonts.googleapis.com/...">`, que
    se descargaba en **cada** visita: la dirección IP de cualquier visitante se
    leía a Google antes de que nadie hubiera contestado nada, y el artículo 14,
    párrafo tercero, del Reglamento de la LFPDPPP obliga a informar en ese mismo
    momento del uso de mecanismos que recaban datos automáticamente.

    Se resuelve en dos pasos:

    1. `styles.scss` tiene `@font-face` apuntando a `/assets/fonts/`, donde se
       sirve Rubik desde el propio dominio. Rubik es SIL OFL 1.1, que permite
       autoalojarla. Cero peticiones a terceros y cero espera: es el camino
       correcto, no una concessions.
    2. El CSS se carga desde el propio origen en la primera visita, así que la
       tipografía tampoco depende del consentimiento de cookies. No es una
       tecnología de terceros y no debe de estar detrás de un banner.
  -->
