<ij-page-header
  [title]="facade.hero().title"
  [lead]="facade.hero().description"
  breadcrumb="Preguntas frecuentes"
/>
<app-faq-accordion
  [tabs]="facade.tabs()"
  [activeTabId]="activeTabId()"
  [items]="visibleItems()"
  [openItemId]="openItemId()"
  (tabSelected)="onTabSelected($event)"
  (itemToggled)="onItemToggled($event)"
/>
